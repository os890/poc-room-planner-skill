<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Room 4 × 5 m</title>
<style>
  :root { --ink:#2b2723; --muted:#6f675e; --accent:#e0662a; --panel:rgba(255,253,250,.9); }
  html, body { margin:0; height:100%; overflow:hidden; background:#dfe8ef; color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; }
  .panel { position:absolute; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-radius:12px; box-shadow:0 6px 24px rgba(40,30,20,.14); }
  #ui { top:16px; left:16px; padding:14px 16px 12px; width:250px; font-size:13px; max-height:calc(100vh - 32px); overflow:auto; }
  #ui h1 { font-size:16px; margin:0; }
  #ui .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
  #ui .toggle { width:26px; height:26px; padding:0; font-size:16px; line-height:1; border-radius:7px; }
  [hidden] { display:none !important; }
  #ui .sub { color:var(--muted); margin-bottom:6px; }
  #ui .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 0 5px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; }
  button { font:inherit; font-size:12px; border:1px solid #d6cdc2; background:#fff; color:var(--ink);
    border-radius:7px; padding:5px 9px; cursor:pointer; }
  button:hover { border-color:#a99d8f; }
  button.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  .slider { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:12px; }
  .slider input { flex:1; }
  #card { top:16px; right:16px; width:270px; padding:14px 16px; font-size:13px; }
  #card h2 { font-size:15px; margin:0 26px 8px 0; }
  #card .close { position:absolute; top:10px; right:10px; border:none; background:none; font-size:18px; line-height:1; padding:2px 6px; color:var(--muted); }
  #card table { border-collapse:collapse; width:100%; }
  #card td { padding:3px 0; }
  #card td:last-child { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  #card.no-numbers td:last-child { visibility:hidden; }
  #card .extra { margin-top:8px; padding-top:8px; border-top:1px solid #e7dfd5; color:var(--muted); line-height:1.45; }
  #card .swatch { display:inline-block; width:9px; height:9px; border-radius:2px; background:var(--accent); margin-right:6px; }
  #scalebar { bottom:52px; right:16px; padding:8px 12px 6px; font-size:12px; text-align:center; }
  #scalebar .bar { height:8px; border:1.5px solid var(--ink); border-top:none; margin:0 auto 3px;
    background:linear-gradient(90deg, var(--ink) 0 50%, #fff 50% 100%); }
  #hint { bottom:12px; left:50%; transform:translateX(-50%); padding:7px 14px; font-size:12px; color:var(--muted); white-space:nowrap; }
  @media (max-width:640px) {
    #ui { width:auto; right:16px; } #card { top:auto; bottom:56px; left:16px; right:16px; width:auto; }
    #hint { white-space:normal; width:calc(100% - 64px); text-align:center; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui" class="panel">
  <div class="head"><h1>Living room</h1><button id="uiToggle" class="toggle" title="Hide controls" aria-expanded="true" aria-controls="uiBody">–</button></div>
  <div id="uiBody">
  <div class="sub">4.00 × 5.00 m · 20.0 m² · ceiling 2.40 m</div>
  <div class="lbl">View</div>
  <div class="row" id="views">
    <button data-view="overview" class="active">3D overview</button>
    <button data-view="plan">Floor plan (to scale)</button>
    <button data-view="door">From the door</button>
    <button data-view="sofa">From the sofa</button>
    <button data-view="dining">From the table</button>
    <button data-view="window">Toward windows</button>
  </div>
  <div class="lbl">Time of day</div>
  <div class="row" id="modes">
    <button data-mode="day" class="active">Day</button>
    <button data-mode="evening">Evening</button>
  </div>
  <div class="lbl">Lights (click to switch on / off)</div>
  <div class="row" id="lights">
    <button data-light="indirect">Indirect (storage)</button>
    <button data-light="ceiling">Ceiling light</button>
    <button data-light="wall">Wall lamp</button>
    <button data-light="floor">Floor lamp</button>
    <button data-light="small">Small lamp</button>
    <button id="lightsOff">All off</button>
  </div>
  <div class="lbl">Sofa colour</div>
  <div class="row" id="sofaColors">
    <button data-sofa="slate" class="active">Slate blue</button>
    <button data-sofa="graphite">Graphite</button>
    <button data-sofa="stone">Stone grey</button>
    <button data-sofa="cognac">Cognac</button>
  </div>
  <div class="lbl">Rug</div>
  <div class="row" id="rugColors">
    <button data-rug="none">No rug</button>
    <button data-rug="cream" class="active">Cream</button>
    <button data-rug="grey">Grey</button>
    <button data-rug="charcoal">Charcoal</button>
    <button data-rug="rust">Rust</button>
    <button data-rug="navy">Navy</button>
  </div>
  <div class="lbl">Show</div>
  <div class="row">
    <button id="tDims" class="active">Room dimensions</button>
    <button id="tGrid">50 cm grid</button>
    <button id="tNums" class="active">Numbers</button>
    <button id="tGaps" class="active">Gap distances</button>
  </div>
  <label class="slider">Brightness <input type="range" id="exposure" min="0.4" max="2" step="0.05" value="1"></label>
  </div>
</div>

<div id="card" class="panel" hidden>
  <button class="close" id="cardClose" title="Close (Esc)">×</button>
  <h2 id="cardTitle"></h2>
  <table id="cardDims"></table>
  <div class="extra" id="cardExtra"></div>
</div>

<div id="scalebar" class="panel" hidden><div class="bar"></div><span></span></div>
<div id="hint" class="panel">Double-click any item to show its dimensions · drag to rotate · right-drag to pan · scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();

// ============================================================================
// Room definition — everything is in metres (1 scene unit = 1 m), true to scale
// x: 0..4 m (width, west → east), z: 0..5 m (depth, north → south), y: up
// North wall (4 m)  = full window wall with radiators below
// East wall  (5 m)  = door in the south-east corner (opposite end from windows)
// ============================================================================
const W = 4, D = 5, H = 2.4, T = 0.2;          // inner width, depth, ceiling height, wall thickness
const X0 = -W / 2, X1 = W / 2, Z0 = -D / 2, Z1 = D / 2;
const SILL = 0.6, WIN_TOP = 2.25;              // window parapet / top (15 cm lintel below the 2.40 m ceiling)
const DOOR = { z0: 1.45, z1: 2.35, h: 2.1 };   // 90 × 210 cm opening, 15 cm from the corner
const ACCENT = 0xe0662a;
const V3 = THREE.Vector3;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261117);

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
let aspect = innerWidth / innerHeight;
const perspCam = new THREE.PerspectiveCamera(50, aspect, 0.03, 200);
perspCam.position.set(5.6, 7.2, 6.6);
const PLAN_HALF = 4.6;
const planCam = new THREE.OrthographicCamera(-PLAN_HALF * aspect, PLAN_HALF * aspect, PLAN_HALF, -PLAN_HALF, 0.1, 80);
planCam.up.set(0, 0, -1);                        // north (window wall) at the top of the plan
planCam.position.set(0, 30, 0.45);
let activeCam = perspCam;

const controls = new OrbitControls(perspCam, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.3; controls.maxDistance = 30;

const planControls = new OrbitControls(planCam, renderer.domElement);
planControls.target.set(0, 0, 0.45);
planControls.enableRotate = false;
planControls.screenSpacePanning = true;
planControls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
planControls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
planControls.minZoom = 0.5; planControls.maxZoom = 10;
planControls.enabled = false;

// ---------------------------------------------------------------- helpers
function mat(color, o = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0, ...o }); }
function mesh(geo, m, parent, x = 0, y = 0, z = 0, { cast = true, receive = true } = {}) {
  const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = cast; me.receiveShadow = receive;
  if (parent) parent.add(me); return me;
}
const box  = (w, h, d, m, x, y, z, p, o) => mesh(new THREE.BoxGeometry(w, h, d), m, p, x, y, z, o);
const rbox = (w, h, d, r, m, x, y, z, p, o) => mesh(new RoundedBoxGeometry(w, h, d, 4, r), m, p, x, y, z, o);
const cyl  = (rt, rb, h, m, x, y, z, p, seg = 32, o) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, p, x, y, z, o);

function canvasTex(w, h, draw, { repeat = [1, 1], srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = maxAniso;
  return t;
}

// ---------------------------------------------------------------- procedural textures
function drawWood(g, x, y, w, h, seed, seams = true) {
  const r = mulberry32(seed);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const hue = 30 + r() * 6, sat = 38 + r() * 10, lig = 58 + r() * 8;
  g.fillStyle = `hsl(${hue},${sat}%,${lig}%)`; g.fillRect(x, y, w, h);
  for (let k = 0; k < 26; k++) {
    const gx = x + r() * w, amp = 2 + r() * 5, f = 0.004 + r() * 0.01, ph = r() * 6.28;
    g.strokeStyle = `hsla(${hue - 4},${sat + 5}%,${lig - 18 - r() * 12}%,${0.08 + r() * 0.16})`;
    g.lineWidth = 0.6 + r() * 1.6; g.beginPath();
    for (let yy = 0; yy <= h; yy += 16) { const px = gx + Math.sin(yy * f + ph) * amp; yy === 0 ? g.moveTo(px, y + yy) : g.lineTo(px, y + yy); }
    g.stroke();
  }
  if (r() < 0.35) { g.fillStyle = `hsla(${hue - 6},45%,${lig - 28}%,0.5)`; g.beginPath();
    g.ellipse(x + r() * w, y + r() * h, 3 + r() * 4, 7 + r() * 8, 0, 0, Math.PI * 2); g.fill(); }
  if (seams) { g.fillStyle = 'rgba(70,45,25,0.55)'; g.fillRect(x + w - 2, y, 2, h); g.fillRect(x, y + h - 2, w, 2); }
  g.restore();
}
// Oak planks: 18 cm wide, canvas = 8 planks (1.44 m) × 2.88 m, planks run perpendicular to the window wall
const PLANK_TILE = [1.44, 2.88];
const floorTex = canvasTex(1024, 2048, (g, w, h) => {
  const cols = 8, pw = w / cols;
  for (let i = 0; i < cols; i++) {
    let y = Math.floor(rand() * h), rem = h;
    while (rem > 0) {
      let len = Math.floor(700 + rand() * 600); if (rem - len < 350) len = rem;
      const seed = Math.floor(rand() * 1e9);
      drawWood(g, i * pw, y, pw, len, seed);
      if (y + len > h) drawWood(g, i * pw, y - h, pw, len, seed);
      y = (y + len) % h; rem -= len;
    }
  }
}, { repeat: [W / PLANK_TILE[0], D / PLANK_TILE[1]] });
const oakTex = canvasTex(256, 512, (g, w, h) => drawWood(g, 0, 0, w, h, 99, false));

// rug colour options (Berber pattern, generated per palette on first use)
const RUG_PALETTES = {
  cream:    { bg: '#e9e1d1', border: '#4a423b', line: 'rgba(62,54,47,0.7)',     side: '#ddd4c3' },
  grey:     { bg: '#c8c6c1', border: '#55555a', line: 'rgba(70,70,74,0.55)',    side: '#bcbab5' },
  charcoal: { bg: '#4a4b4f', border: '#d8d2c6', line: 'rgba(226,220,208,0.55)', side: '#434448' },
  rust:     { bg: '#b56a4b', border: '#efe3cf', line: 'rgba(246,232,212,0.6)',  side: '#a65f42' },
  navy:     { bg: '#3d4b5e', border: '#e6dccb', line: 'rgba(232,224,210,0.55)', side: '#374456' },
};
const rugTexCache = {};
const rugTexFor = key => rugTexCache[key] || (rugTexCache[key] = canvasTex(512, 676, (g, w, h) => {
  const p = RUG_PALETTES[key];
  g.fillStyle = p.bg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14000; i++) { g.fillStyle = rand() < 0.5 ? 'rgba(60,50,40,0.08)' : 'rgba(255,255,255,0.12)';
    g.fillRect(rand() * w, rand() * h, 2, 2); }
  g.strokeStyle = p.border; g.lineWidth = 7; g.strokeRect(22, 22, w - 44, h - 44);
  g.lineWidth = 2; g.strokeRect(36, 36, w - 72, h - 72);
  g.save(); g.beginPath(); g.rect(48, 48, w - 96, h - 96); g.clip();
  g.strokeStyle = p.line; g.lineWidth = 3;
  const jitter = () => (rand() - 0.5) * 5;
  for (let k = -h; k < w + h; k += 70) for (const dir of [1, -1]) {
    g.beginPath();
    for (let s = 0; s <= 12; s++) { const t = s / 12, px = k + dir * t * h, py = t * h;
      s === 0 ? g.moveTo(px + jitter(), py) : g.lineTo(px + jitter(), py + jitter()); }
    g.stroke();
  }
  g.restore();
}, { repeat: [1, 1] }));

const fabricTex = canvasTex(128, 128, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = 228 + rand() * 27 - ((x + y) % 3 === 0 ? 8 : 0); const i = (y * w + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}, { repeat: [3, 3] });

const radiatorTex = canvasTex(64, 8, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, w, 0);
  grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.45, '#f1f1ee'); grd.addColorStop(0.5, '#d8d8d4'); grd.addColorStop(0.55, '#f1f1ee'); grd.addColorStop(1, '#ffffff');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
});

function artTex(kind) {
  return canvasTex(600, 800, (g, w, h) => {
    if (kind === 0) {
      g.fillStyle = '#efe6d6'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#c46a43'; g.beginPath(); g.arc(300, 330, 170, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#8e9c7c'; g.beginPath(); g.arc(300, 800, 260, Math.PI, 0); g.fill();
      g.strokeStyle = '#2f3d4f'; g.lineWidth = 18; g.beginPath(); g.arc(190, 540, 120, Math.PI, Math.PI * 2); g.stroke();
      g.fillStyle = '#d4a24c'; g.beginPath(); g.arc(455, 165, 48, 0, Math.PI * 2); g.fill();
    } else {
      g.fillStyle = '#f0e9dc'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#d4a24c'; g.beginPath(); g.arc(410, 230, 80, 0, Math.PI * 2); g.fill();
      const hill = (y0, c, a) => { g.fillStyle = c; g.beginPath(); g.moveTo(0, h); g.lineTo(0, y0);
        g.bezierCurveTo(w * 0.3, y0 - a, w * 0.6, y0 + a, w, y0 - a * 0.4); g.lineTo(w, h); g.fill(); };
      hill(430, '#a9b394', 90); hill(520, '#6f7f63', 70); hill(620, '#c46a43', 60); hill(700, '#2f3d4f', 40);
    }
  });
}

function gradientTex(stops) {
  const t = canvasTex(2, 512, (g, w, h) => { const grd = g.createLinearGradient(0, 0, 0, h);
    stops.forEach(([o, c]) => grd.addColorStop(o, c)); g.fillStyle = grd; g.fillRect(0, 0, w, h); });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
}
const skyDay = gradientTex([[0, '#8fbbe3'], [0.55, '#cfe0ee'], [1, '#eef2f2']]);
const skyEvening = gradientTex([[0, '#0b1229'], [0.6, '#27294a'], [1, '#5a4552']]);

// ---------------------------------------------------------------- shared materials
const M = {
  oak: mat('#f2e3cf', { map: oakTex, roughness: 0.6 }),
  walnut: mat('#6e4a33', { roughness: 0.55 }),
  black: mat('#232323', { roughness: 0.45, metalness: 0.5 }),
  white: mat('#f5f3ef', { roughness: 0.5 }),
  ceramic: mat('#ece7de', { roughness: 0.4 }),
  terracotta: mat('#b5673f', { roughness: 0.85 }),
  brass: mat('#b8925a', { roughness: 0.35, metalness: 0.85 }),
  steel: mat('#c2c2be', { roughness: 0.3, metalness: 0.9 }),
  soil: mat('#3b2c22', { roughness: 1 }),
  frame: mat('#3a3d41', { roughness: 0.45, metalness: 0.35 }),
  stone: mat('#e4e0d8', { roughness: 0.6 }),
};
const leafMats = [mat('#3f6b3a', { roughness: 0.6 }), mat('#4f7d44', { roughness: 0.6 }), mat('#355c33', { roughness: 0.6 })];

// ---------------------------------------------------------------- item registry (double-click → dimensions)
const items = [];
/** Registers a group as a selectable item. Its local bounding box is measured before placing/rotating it. */
function item(name, group, { pos = [0, 0, 0], rotY = 0, parent = scene, extra = [], round = false, box: bx = null, clearance = true } = {}) {
  group.updateMatrixWorld(true);
  const b = bx || new THREE.Box3().setFromObject(group);
  group.position.set(...pos); group.rotation.y = rotY;
  group.userData.item = { name, box: b, extra, round, clearance };
  parent.add(group); items.push(group);
  return group;
}

// ---------------------------------------------------------------- floor, slab, ceiling
const floorGroup = new THREE.Group();
box(W + 2 * T, 0.12, D + 2 * T, mat('#bdb6ab', { roughness: 0.9 }), 0, -0.06, 0, floorGroup);
const floor = mesh(new THREE.PlaneGeometry(W, D), mat('#ffffff', { map: floorTex, roughness: 0.55 }), floorGroup, 0, 0.001, 0, { cast: false });
floor.rotation.x = -Math.PI / 2;
item('Living room', floorGroup, { box: new THREE.Box3(new V3(X0, 0, Z0), new V3(X1, H, Z1)), clearance: false,
  extra: ['Floor area 20.0 m² · oak plank floor', 'Ceiling height 2.40 m', 'Windows on the north 4 m wall, door in the far corner of the west 5 m wall',
          'Dining area by the windows, living area towards the back'] });

// Ceiling: faces downward only → invisible from above, visible from inside, still casts shadows
const ceilingMat = mat('#ffffff', { roughness: 1, emissive: '#ffffff', emissiveIntensity: 0.3 });   // emissive = soft bounce light, keeps it reading white
const ceiling = mesh(new THREE.PlaneGeometry(W, D), ceilingMat, scene, 0, H, 0);
ceiling.rotation.x = Math.PI / 2;

// ---------------------------------------------------------------- walls (cut away automatically when they face the camera)
const walls = [];
const stubMat = mat('#c9c0b2', { roughness: 0.9 });
function makeWall(name, normal, point, segments, opts) {
  const full = new THREE.Group(), stub = new THREE.Group();
  const wm = mat('#f4e8bc', { roughness: 0.95 });          // light yellow
  for (const s of segments) {
    box(s.w, s.y1 - s.y0, s.d, wm, s.x, (s.y0 + s.y1) / 2, s.z, full);
    if (s.y0 === 0) box(s.w, 0.12, s.d, stubMat, s.x, 0.06, s.z, stub);
  }
  stub.visible = false; scene.add(stub);
  item(name, full, { clearance: false, ...opts });
  const w = { name, normal, point, full, stub, attached: [], cut: false };
  walls.push(w); return w;
}
function setCut(w, cut) {
  w.cut = cut;
  w.full.traverse(o => {
    if (!o.isMesh) return;
    if (!o.userData.ownMat) { o.material = o.material.clone(); o.userData.ownMat = true; o.userData.dw = o.material.depthWrite; }
    o.material.colorWrite = !cut;                 // still writes to the shadow map → light through the windows stays correct
    o.material.depthWrite = cut ? false : o.userData.dw;
  });
  w.stub.visible = cut;
  w.attached.forEach(o => (o.visible = !cut));
}

const north = makeWall('Window wall (north)', new V3(0, 0, -1), new V3(0, 0, Z0), [
  { x: 0, z: Z0 - T / 2, w: W, d: T, y0: 0, y1: SILL },
  { x: 0, z: Z0 - T / 2, w: W, d: T, y0: WIN_TOP, y1: H },
], { box: new THREE.Box3(new V3(X0, 0, Z0 - T), new V3(X1, H, Z0)), extra: ['Glazed across the full 4 m width', 'Radiators below the windows – kept free of furniture'] });

const south = makeWall('Back wall (south)', new V3(0, 0, 1), new V3(0, 0, Z1), [
  { x: 0, z: Z1 + T / 2, w: W, d: T, y0: 0, y1: H },

/** Carcass built from boards; each section is either a (fluted) door or open shelving.
 *  Origin at the bottom centre, front = +z. Returns the group; open compartments in g.userData.slots. */
function cabinet(w, h, d, sections, { fluted = false, body = M.oak, inner = body === M.oak ? oakIn : paintedIn, open = [], glass = [] } = {}) {
  const g = new THREE.Group(), t = 0.018, sw = w / sections, slots = [];
  box(w, t, d, body, 0, t / 2, 0, g); box(w, t, d, body, 0, h - t / 2, 0, g);
  box(t, h, d, body, -w / 2 + t / 2, h / 2, 0, g); box(t, h, d, body, w / 2 - t / 2, h / 2, 0, g);
  box(w - 2 * t, h - 2 * t, 0.008, inner, 0, h / 2, -d / 2 + 0.004, g);
  for (let i = 1; i < sections; i++) box(t, h - 2 * t, d - 0.008, body, -w / 2 + i * sw, h / 2, 0.004, g);
  for (let i = 0; i < sections; i++) {
    const xl = -w / 2 + i * sw + (i === 0 ? t : t / 2), xr = -w / 2 + (i + 1) * sw - (i === sections - 1 ? t : t / 2), cx = (xl + xr) / 2;
    if (open.includes(i) || glass.includes(i)) {
      const ih = h - 2 * t, n = Math.max(1, Math.round(ih / 0.38)), step = ih / n;
      for (let k = 0; k < n; k++) {
        if (k > 0) box(xr - xl, t, d - 0.01, body, cx, t + k * step, 0.005, g);
        slots.push({ xl, xr, y0: t + k * step + (k > 0 ? t / 2 : 0), y1: t + (k + 1) * step - (k < n - 1 ? t / 2 : 0) });
      }
      if (glass.includes(i)) {                      // framed glass door
        const dw = sw - 0.004, dcx = -w / 2 + (i + 0.5) * sw, fz = d / 2 + 0.009, fw = 0.03, dh = h - 0.004;
        box(dw, fw, 0.018, body, dcx, (h - dh) / 2 + fw / 2, fz, g); box(dw, fw, 0.018, body, dcx, h - (h - dh) / 2 - fw / 2, fz, g);
        box(fw, dh - 2 * fw, 0.018, body, dcx - dw / 2 + fw / 2, h / 2, fz, g); box(fw, dh - 2 * fw, 0.018, body, dcx + dw / 2 - fw / 2, h / 2, fz, g);
        const pane = mesh(new THREE.PlaneGeometry(dw - 2 * fw, dh - 2 * fw), glassDoorMat, g, dcx, h / 2, fz, { cast: false, receive: false });
        pane.renderOrder = 4;
      }
      continue;
    }
    const dw = sw - 0.004, dcx = -w / 2 + (i + 0.5) * sw;
    box(dw, h - 0.004, 0.018, body, dcx, h / 2, d / 2 + 0.009, g);
    if (!fluted) continue;
    const nf = Math.floor(dw / 0.032);
    for (let k = 0; k < nf; k++) box(0.02, h - 0.05, 0.01, fluteMat, dcx - dw / 2 + (k + 0.5) * dw / nf, h / 2, d / 2 + 0.023, g, { cast: false });
  }
  g.userData.slots = slots;
  return g;
}
/** Fills an open compartment with books, a basket, decor or a media device. */
function fillSlot(g, s, d, kind) {
  const w = s.xr - s.xl, hh = s.y1 - s.y0, cx = (s.xl + s.xr) / 2;
  if (kind === 'glasses' || kind === 'wine' || kind === 'tumblers') {   // drinking glasses (one row, or two for 'glasses')
    const n = Math.floor((w - 0.03) / 0.088);
    const rows = kind === 'glasses' ? [[-0.06, hh > 0.25], [0.06, false]] : [[0, kind === 'wine' && hh > 0.25]];
    for (const [row, wine] of rows) for (let k = 0; k < n; k++) {
      const x = s.xl + 0.015 + (k + 0.5) * (w - 0.03) / n;
      if (wine) mesh(wineGeo, glassObjMat, g, x, s.y0, row, { cast: false, receive: false }).renderOrder = 3;
      else { mesh(tumblerGeo, glassObjMat, g, x, s.y0 + 0.05, row, { cast: false, receive: false }).renderOrder = 3;
        cyl(0.031, 0.031, 0.006, glassObjMat, x, s.y0 + 0.003, row, g, 24, { cast: false, receive: false }); }
    }
    return;
  }
  if (kind === 'basket') { rbox(Math.min(0.5, w - 0.04), Math.min(0.28, hh - 0.04), d - 0.06, 0.02, wicker, cx, s.y0 + Math.min(0.28, hh - 0.04) / 2, 0, g); return; }
  if (kind === 'device') { box(Math.min(0.38, w - 0.06), 0.06, d - 0.1, M.black, cx, s.y0 + 0.03, -0.01, g);
    box(Math.min(0.3, w - 0.08), 0.05, d - 0.12, mat('#d8cbb3'), cx, s.y0 + 0.085, -0.01, g); return; }
  if (kind === 'decor') {
    mesh(new THREE.LatheGeometry([[0, 0], [0.05, 0], [0.065, 0.07], [0.035, 0.17], [0.04, 0.2]].map(p => new THREE.Vector2(...p)), 32),
      rand() < 0.5 ? M.ceramic : M.terracotta, g, cx - w * 0.18, s.y0, 0);
    box(Math.min(0.18, w * 0.4), 0.05, d * 0.6, bookMatsAll[Math.floor(rand() * bookMatsAll.length)], cx + w * 0.2, s.y0 + 0.025, 0, g);
    return;
  }
  let x = s.xl + 0.01; const lim = s.xl + w * (0.6 + rand() * 0.3);       // books

  }
  const res = [];
  for (const d of GAP_DIRS) {
    const a = d.axis, p = a === 'x' ? 'z' : 'x', face = d.sgn > 0 ? b.max[a] : b.min[a];
    let best = null;
    if (d.sgn > 0 ? face <= d.wall + 1e-3 : face >= d.wall - 1e-3) best = { gap: d.sgn * (d.wall - face), name: d.wallName, to: d.wall, box: null };
    for (const t of targets) {
      if (Math.min(b.max.y, t.box.max.y) - Math.max(b.min.y, t.box.min.y) <= 0.01) continue;   // not at the same height
      if (Math.min(b.max[p], t.box.max[p]) - Math.max(b.min[p], t.box.min[p]) < -0.03) continue; // not in line
      const tf = d.sgn > 0 ? t.box.min[a] : t.box.max[a], gap = d.sgn * (tf - face);
      if (gap < -0.005) continue;                                                                  // behind or overlapping
      if (!best || gap < best.gap) best = { gap, name: t.name, to: tf, box: t.box };
    }
    if (best) res.push({ ...d, ...best, face, p });
  }
  return res;
}
function drawGaps(b, gaps) {
  gapOverlay = new THREE.Group();
  const lm = new THREE.LineBasicMaterial({ color: GAP_COLOR, depthTest: false, transparent: true });
  const center = b.getCenter(new V3());
  for (const g of gaps) {
    if (g.gap < 0.01) continue;                                                                    // touching – nothing to show
    let pc = center[g.p];
    if (g.box) { const lo = Math.max(b.min[g.p], g.box.min[g.p]), hi = Math.min(b.max[g.p], g.box.max[g.p]); if (hi - lo > 0.05) pc = (lo + hi) / 2; }
    const y = Math.min(b.max.y, Math.max(b.min.y, g.box ? g.box.min.y : 0) + 0.03);
    const p1 = new V3(), p2 = new V3();
    p1[g.axis] = g.face; p2[g.axis] = g.to; p1[g.p] = p2[g.p] = pc; p1.y = p2.y = y;
    const tick = new V3(); tick[g.p] = 0.04;
    const dl = dimLine(p1, p2, `${fmtGap(g.gap)} → ${g.name}`, lm, tick, 0.14, { color: '#ffffff', bg: 'rgba(43,108,176,0.92)' });
    dl.traverse(c => (c.renderOrder = c.isSprite ? 32 : 26));
    gapOverlay.add(dl);
  }
  gapOverlay.visible = showGaps;
  scene.add(gapOverlay);
}

function select(grp) {
  clearSelection();
  selected = grp;
  const info = grp.userData.item, b = info.box, size = b.getSize(new V3());
  const worldBox = new THREE.Box3().setFromObject(grp);    // measured before the overlay is attached

  // 3D overlay in the item's own (local) frame: outline box + width / depth / height dimension lines
  overlay = new THREE.Group();
  const lm = new THREE.LineBasicMaterial({ color: ACCENT, depthTest: false, transparent: true });
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z)), lm);
  edges.position.copy(b.getCenter(new V3())); edges.renderOrder = 25; overlay.add(edges);
  const off = 0.1, y0 = b.min.y + 0.005;
  const add = o => { o.traverse(c => (c.renderOrder = c.isSprite ? 31 : 25)); overlay.add(o); };
  if (size.x > 0.005) add(dimLine(new V3(b.min.x, y0, b.max.z + off), new V3(b.max.x, y0, b.max.z + off), cm(size.x), lm, new V3(0, 0, 0.04), 0.16));
  if (size.z > 0.005 && !info.round) add(dimLine(new V3(b.max.x + off, y0, b.min.z), new V3(b.max.x + off, y0, b.max.z), cm(size.z), lm, new V3(0.04, 0, 0), 0.16));
  if (size.y > 0.005) add(dimLine(new V3(b.max.x + off, b.min.y, b.max.z + off), new V3(b.max.x + off, b.max.y, b.max.z + off), cm(size.y), lm, new V3(0.04, 0, 0), 0.16));
  grp.add(overlay);

  // info card
  const horiz = [size.x, size.z].sort((a, c) => c - a);
  const rows = info.round
    ? [['Diameter', cm(horiz[0])], ['Height', cm(size.y)]]
    : [['Width', cm(horiz[0])], ['Depth', cm(horiz[1])], ['Height', cm(size.y)]];
  if (worldBox.min.y > 0.02 && info.clearance) rows.push(['Bottom edge above floor', cm(worldBox.min.y)]);
  const isStructure = walls.some(w => w.full === grp) || info.name === 'Living room';
  if (!isStructure) {
    const gaps = computeGaps(grp, worldBox);
    drawGaps(worldBox, gaps);
    if (gaps.length) rows.push(['<b>Free space to the next part</b>', '']);
    for (const g of gaps) rows.push([`${g.label} <span style="color:#6f675e">(${g.name})</span>`, g.gap < 0.01 ? 'touching' : fmtGap(g.gap)]);
  }
  document.getElementById('cardTitle').innerHTML = `<span class="swatch"></span>${info.name}`;
  document.getElementById('cardDims').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  const ex = document.getElementById('cardExtra');
  ex.innerHTML = info.extra.join('<br>'); ex.hidden = !info.extra.length;
  card.hidden = false;
}

renderer.domElement.addEventListener('dblclick', e => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, activeCam);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const h of hits) {
    if (!h.object.isMesh || !shownInScene(h.object)) continue;
    const it = findItem(h.object);
    if (it) { select(it); return; }
    if (h.object !== ceiling) break;                       // hit something solid that is not an item (e.g. ground)
  }
  clearSelection();
});
document.getElementById('cardClose').addEventListener('click', clearSelection);
addEventListener('keydown', e => { if (e.key === 'Escape') clearSelection(); });

// ---------------------------------------------------------------- loop
const tmp = new V3();
function updateCutaway() {
  if (planMode) return;
  for (const w of walls) {
    const outside = tmp.copy(perspCam.position).sub(w.point).dot(w.normal) > 0.02;
    if (outside !== w.cut) setCut(w, outside);
  }
}
function updatePlanScale() {
  const pxPerM = innerHeight / ((planCam.top - planCam.bottom) / planCam.zoom);
  const len = [0.25, 0.5, 1, 2, 5].find(l => l * pxPerM >= 70) || 5;
  scaleEl.querySelector('.bar').style.width = `${len * pxPerM}px`;
  scaleEl.querySelector('span').textContent = len < 1 ? `${len * 100} cm` : `${len} m`;
}
function frame(now) {
  if (anim) {
    const k = Math.min(1, (now - anim.start) / anim.dur), e = k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2;
    perspCam.position.lerpVectors(anim.p0, anim.p1, e);
    controls.target.lerpVectors(anim.t0, anim.t1, e);
    perspCam.fov = anim.f0 + (anim.f1 - anim.f0) * e; perspCam.updateProjectionMatrix();
    if (k >= 1) anim = null;
  }
  (planMode ? planControls : controls).update();
  updateCutaway();
  if (planMode) updatePlanScale();
  renderer.render(scene, activeCam);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  perspCam.aspect = aspect; perspCam.updateProjectionMatrix();
  planCam.left = -PLAN_HALF * aspect; planCam.right = PLAN_HALF * aspect; planCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.querySelectorAll('#sofaColors button').forEach(b => b.addEventListener('click', () => setSofaScheme(b.dataset.sofa)));
setSofaScheme('slate');
setRug('cream');
setMode('day');
requestAnimationFrame(frame);
</script>
</body>
